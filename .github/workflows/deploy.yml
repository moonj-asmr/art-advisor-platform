name: iOS

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Pull requests: compile the iOS app, no signing, no upload.
  build_check:
    if: github.event_name == 'pull_request'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app and sync into the iOS shell
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync ios
        env:
          VITE_API_URL: ${{ vars.RAILWAY_APP_URL || 'https://art-advisor-platform-production.up.railway.app' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Compile check
        run: bundle exec fastlane ios build_check

  # Pushes to main: signed release straight to TestFlight.
  beta:
    if: github.event_name == 'push'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app and sync into the iOS shell
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync ios
        env:
          VITE_API_URL: ${{ vars.RAILWAY_APP_URL || 'https://art-advisor-platform-production.up.railway.app' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build, sign, and upload to TestFlight
        run: bundle exec fastlane ios beta
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'MY9X7AJBKT' }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || 'https://github.com/moonj-asmr/advisorydeck-certificates.git' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_REPO_PAT: ${{ secrets.MATCH_REPO_PAT }}

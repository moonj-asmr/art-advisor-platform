name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # manual compile check on any branch

jobs:
  # Pull requests (and manual runs): compile the iOS app, no signing, no upload.
  build_check:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app and sync into the iOS shell
        working-directory: frontend
        run: |
          npm ci
          # lockfiles written on Linux omit the macOS bundler binary (npm bug #4828)
          npm i --no-save @rollup/rollup-darwin-arm64
          npm run build
          npx cap sync ios
        env:
          VITE_API_URL: ${{ vars.RAILWAY_APP_URL || 'https://art-advisor-platform-production.up.railway.app' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Compile check
        run: bundle exec fastlane ios build_check

  # Pushes to main: signed release straight to TestFlight.
  beta:
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build web app and sync into the iOS shell
        working-directory: frontend
        run: |
          npm ci
          # lockfiles written on Linux omit the macOS bundler binary (npm bug #4828)
          npm i --no-save @rollup/rollup-darwin-arm64
          npm run build
          npx cap sync ios
        env:
          VITE_API_URL: ${{ vars.RAILWAY_APP_URL || 'https://art-advisor-platform-production.up.railway.app' }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build, sign, and upload to TestFlight
        run: bundle exec fastlane ios beta
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || 'MY9X7AJBKT' }}
          MATCH_GIT_URL: ${{ vars.MATCH_GIT_URL || 'https://github.com/moonj-asmr/advisorydeck-certificates.git' }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_REPO_PAT: ${{ secrets.MATCH_REPO_PAT }}

  # Manual-only: proves every secret works before the first real signing run.
  # Nothing is created anywhere — read/write probe on the certificates repo
  # plus a read-only App Store Connect API call.
  preflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: All five secrets present
        env:
          A: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          B: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          C: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          D: ${{ secrets.MATCH_PASSWORD }}
          E: ${{ secrets.MATCH_REPO_PAT }}
        run: |
          ok=1
          for pair in "APP_STORE_CONNECT_API_KEY_ID:$A" "APP_STORE_CONNECT_API_ISSUER_ID:$B" "APP_STORE_CONNECT_API_KEY_CONTENT:$C" "MATCH_PASSWORD:$D" "MATCH_REPO_PAT:$E"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ -z "$val" ]; then echo "MISSING: $name"; ok=0; else echo "present: $name"; fi
          done
          [ "$ok" = "1" ]

      - name: MATCH_REPO_PAT can read and write the certificates repo
        env:
          MATCH_REPO_PAT: ${{ secrets.MATCH_REPO_PAT }}
        run: |
          URL="https://x-access-token:${MATCH_REPO_PAT}@github.com/moonj-asmr/advisorydeck-certificates.git"
          git ls-remote "$URL" > /dev/null && echo "read OK"
          tmp=$(mktemp -d) && cd "$tmp" && git init -q -b main . \
            && git -c user.email=ci@local -c user.name=ci commit --allow-empty -qm "CI write probe"
          if git ls-remote --heads "$URL" | grep -q .; then
            # repo has branches: create and remove a throwaway ref
            git push -q "$URL" HEAD:refs/heads/__pat-probe-2 \
              && git push -q "$URL" :refs/heads/__pat-probe-2 \
              && echo "write OK (probe ref created and removed)"
          else
            # empty repo: the first pushed branch becomes the default and
            # cannot be deleted — initialize it as main instead
            git push -q "$URL" HEAD:refs/heads/main && echo "write OK (initialized empty repo with main)"
          fi

      - name: App Store Connect API key authenticates
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
        run: |
          sudo gem install jwt --no-document -q
          # Prints only lengths/format checks and HTTP codes — never secret values.
          # Tries both Apple auth styles: Team key (uses Issuer ID) and
          # Individual key (no Issuer ID), so a wrong key *type* is diagnosed
          # instead of showing up as a bare 401.
          ruby -r jwt -r openssl -r base64 -r json -r net/http <<'RUBY'
          kid = ENV["KEY_ID"].to_s.strip
          iss = ENV["ISSUER_ID"].to_s.strip
          puts "KEY_ID: #{kid.length} chars (expect 10), format #{kid.match?(/\A[A-Z0-9]{10}\z/) ? "OK" : "WRONG - must be exactly the 10 letters/digits from the AuthKey_XXXXXXXXXX.p8 filename"}"
          puts "ISSUER_ID: #{iss.length} chars (expect 36), format #{iss.match?(/\A\h{8}-\h{4}-\h{4}-\h{4}-\h{12}\z/) ? "OK" : "WRONG - must be the dashed UUID from the top of Users and Access > Integrations"}"
          raw = ENV["KEY_CONTENT"].strip.gsub("\\n", "\n")
          if raw.include?("BEGIN") && !raw.include?("\n")
            b64 = raw[/BEGIN PRIVATE KEY-{5}(.*?)-{5}END/m, 1].to_s.gsub(/\s+/, "")
            raw = "-----BEGIN PRIVATE KEY-----\n" + b64.scan(/.{1,64}/).join("\n") + "\n-----END PRIVATE KEY-----\n"
          end
          key = begin
            OpenSSL::PKey.read(raw)
          rescue OpenSSL::PKey::PKeyError
            OpenSSL::PKey.read(Base64.decode64(raw))
          end
          puts ".p8 private key parsed OK"
          now = Time.now.to_i
          base = { iat: now, exp: now + 600, aud: "appstoreconnect-v1" }
          attempts = {
            "Team key auth" => JWT.encode(base.merge(iss: iss), key, "ES256", { kid: kid }),
            "Individual key auth" => JWT.encode(base.merge(sub: "user"), key, "ES256", { kid: kid }),
          }
          uri = URI("https://api.appstoreconnect.apple.com/v1/apps?fields%5Bapps%5D=bundleId,name")
          winner = nil
          attempts.each do |label, token|
            res = Net::HTTP.start(uri.host, uri.port, use_ssl: true) do |http|
              req = Net::HTTP::Get.new(uri)
              req["Authorization"] = "Bearer #{token}"
              http.request(req)
            end
            puts "#{label}: HTTP #{res.code}"
            (winner = [label, res.body]) and break if res.code == "200"
          end
          unless winner
            abort <<~MSG
              Apple rejected both auth styles. The .p8 parsed fine, so one of these is true:
                - APP_STORE_CONNECT_API_KEY_ID does not belong to this .p8 file
                  (the downloaded filename AuthKey_XXXXXXXXXX.p8 shows the matching ID)
                - APP_STORE_CONNECT_API_ISSUER_ID is wrong (Issuer ID at the top of
                  App Store Connect > Users and Access > Integrations)
                - the key was revoked, or was created only minutes ago (Apple can
                  take a few minutes to activate a brand-new key - retry shortly)
            MSG
          end
          label, body = winner
          puts "API key OK (#{label}). Apps in the account:"
          apps = JSON.parse(body)["data"]
          apps.each { |a| puts "  #{a["attributes"]["name"]} - #{a["attributes"]["bundleId"]}" }
          if apps.any? { |a| a["attributes"]["bundleId"] == "com.advisorydeck.app" }
            puts "app record com.advisorydeck.app EXISTS"
          else
            puts "WARNING: no app record with bundle ID com.advisorydeck.app yet - create it in App Store Connect before the first TestFlight upload"
          end
          if label.include?("Individual")
            puts "NOTE: this is an Individual API key; the signing pipeline is set up for a Team key. Create a Team key instead, or ask Claude to switch the pipeline to individual-key auth."
          end
          RUBY
